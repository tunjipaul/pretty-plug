<style>

            padding-right: 0;

            outline: none;
        }

            animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

<body class="bg-surface text-on-surface antialiased overflow-hidden">
<main class="h-screen w-full flex flex-col md:flex-row">
<!-- Editorial Image Side -->
<section class="hidden md:flex md:w-1/2 h-full relative overflow-hidden bg-surface-container-low">
<div class="absolute inset-0 z-0 scale-105 hover:scale-100 transition-transform duration-[3000ms] ease-out">

</div>
<div class="absolute inset-0 bg-primary/5 mix-blend-multiply"></div>
<div class="relative z-10 w-full h-full p-margin-desktop flex flex-col justify-between text-on-primary">
<div>
<span class="font-headline-sm text-headline-sm font-bold tracking-tight text-white drop-shadow-sm">Beauty Plug</span>
</div>
<div class="max-w-md">
<h2 class="font-headline-lg text-headline-lg text-white mb-4 leading-tight">Elevating Nigerian Beauty Standards.</h2>
<p class="font-body-lg text-body-lg text-white/90">Curating the finest salon experiences in Victoria Island and beyond.</p>
</div>
</div>
</section>
<!-- Form Side -->
<section class="w-full md:w-1/2 h-full flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-surface login-fade-in">
<div class="w-full max-w-[420px] flex flex-col">
<!-- Branding for Mobile -->
<div class="md:hidden mb-12 flex justify-center">
<span class="font-headline-md text-headline-md font-bold tracking-tight text-primary">Beauty Plug</span>
</div>
<div class="mb-10">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to manage your beauty suite appointments.</p>
</div>
<form class="space-y-8" onsubmit="event.preventDefault();">
<div class="group">
<label class="font-label-caps text-label-caps text-on-surface-variant block mb-1" for="email">Email Address</label>
<input class="w-full form-input-minimal font-body-md text-body-md text-on-surface placeholder:text-outline-variant/60" id="email" name="email" placeholder="admin@beautyplug.com" required="" type="email"/>
</div>
<div class="group">
<div class="flex justify-between items-center mb-1">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">Password</label>
<a class="font-label-caps text-label-caps text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">Forgot Password?</a>
</div>
<input class="w-full form-input-minimal font-body-md text-body-md text-on-surface placeholder:text-outline-variant/60" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="flex items-center space-x-2">
<input class="w-4 h-4 rounded-sm border-outline-variant text-primary focus:ring-primary/20" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant" for="remember">Keep me signed in</label>
</div>
<button class="w-full h-[56px] bg-primary text-on-primary font-label-caps text-label-caps tracking-widest rounded-none shadow-sm hover:bg-on-primary-fixed-variant active:scale-[0.98] transition-all duration-300" type="submit">
                        SIGN IN
                    </button>
</form>
<div class="mt-16 pt-8 border-t border-outline-variant/20 flex flex-col items-center space-y-4">
<a class="flex items-center space-x-2 text-on-surface-variant hover:text-primary transition-colors group" href="#">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
<span class="font-label-caps text-label-caps">Return to Website</span>
</a>
</div>
</div>
</section>
</main>
<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('.form-input-minimal').forEach(input => {
            input.addEventListener('focus', () => {
                input.previousElementSibling.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.previousElementSibling.classList.remove('text-primary');
            });
        });
    </script>
